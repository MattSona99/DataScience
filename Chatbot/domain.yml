version: "3.1"

intents:
  - greet
  - goodbye
  - submit      # user confirms: "yes, show me the results"
  - deny        # user says no / wants to change something
  - request_form  # user asks for a video game recommendation
  - inform        # user specifies preferences (console, genre, budget, ...)

entities:
  - console
  - publisher
  - genre
  - release_year
  - rating
  - used_price
  - review_score
  - max_player
  - platform
  - online
  - multiplatform

slots:
  console:
    type: text
    mappings:
      - type: from_entity
        entity: console
    influence_conversation: true
  genre:
    type: text
    mappings:
      - type: from_entity
        entity: genre
    influence_conversation: true
  release_year:
    type: float
    mappings:
      - type: from_entity
        entity: release_year
    influence_conversation: false
  used_price:
    type: float
    mappings:
      - type: from_entity
        entity: used_price
    influence_conversation: false
  review_score:
    type: float
    mappings:
      - type: from_entity
        entity: review_score
    influence_conversation: false
  max_player:
    type: float
    mappings:
      - type: from_entity
        entity: max_player
    influence_conversation: false
  online:
    type: bool
    mappings:
      - type: from_entity
        entity: online
    influence_conversation: false
  multiplatform:
    type: bool
    mappings:
      - type: from_entity
        entity: multiplatform
    influence_conversation: false
  publisher:
    type: text
    mappings:
      - type: from_entity
        entity: publisher
    influence_conversation: false

forms:
  game_preferences_form:
    required_slots:
      - console
      - genre
      - used_price
      - release_year
      - review_score
      - max_player
      - online
      - multiplatform

responses:
  utter_greet:
    - text: "Hi! 👋 I'm your retro gaming assistant. Do you want me to help you find a vintage video game?"

  utter_goodbye:
    - text: "Great, enjoy your retro gaming session! 🎮"

  utter_ask_console:
    - text: "On which console or device do you want to play? (e.g. Nintendo DS, PSP, PS2...)"

  utter_ask_genre:
    - text: "Which genre do you like the most? For example Action, RPG, Sports, Puzzle..."

  utter_ask_used_price:
    - text: "Do you have a maximum budget for a used game? Tell me an amount (e.g. 20), or type 'no limit'."

  utter_ask_release_year:
    - text: "Do you prefer games from a specific period? For example: before 2005, after 2004, or a specific year."

  utter_ask_review_score:
    - text: "How good should the reviews be? (e.g. at least 80 out of 100)"

  utter_ask_max_player:
    - text: "Are you looking for a single-player game or multiplayer? Tell me the maximum number of players."

  utter_ask_online:
    - text: "Is it important that the game has online features? (yes/no)"

  utter_ask_multiplatform:
    - text: "Do you want only platform exclusives, or are multiplatform games also fine? (type 'exclusive' or 'multiplatform')"

  utter_start_recommendation:
    - text: "Great! I'll ask you a few questions so I can recommend something that fits you. Tell me 🙂"

  utter_confirm_preferences:
    - text: |
        Perfect, here is a summary of your preferences:
        • Console: {console}
        • Genre: {genre}
        • Used game budget: {used_price}
        • Release year: {release_year}
        • Minimum review score: {review_score}
        • Max players: {max_player}
        • Online: {online}
        • Multiplatform: {multiplatform}

        Do you want me to search for the best games with these filters?

  utter_submit:
    - text: "Okay, I'll search my archive of vintage games and show you some interesting titles... 🎮"

  utter_no_results:
    - text: "I couldn't find any games matching all your filters. Do you want to relax the criteria a bit (e.g. higher budget or lower minimum review score)?"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
