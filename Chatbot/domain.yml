version: "3.1"

intents:
  - greet
  - goodbye
  - help
  - submit        # user confirms: "yes, show me the results"
  - deny          # user says no / wants to change something
  - request_form  # user asks for a video game recommendation
  - inform        # user specifies preferences (console, genre, budget, ...)
  - search        # user confirms: "yes, show me the results"
  - stop_searching  # user wants to stop the search / end the conversation
  - reset       # user wants to restart the preference selection
  - filters     # user specifies which filters to relax
  - ask_best_sellers      # "Quali sono i giochi più venduti?"
  - ask_highest_rated     # "Quali sono i giochi migliori?"
  - save_game             # "Salva Super Mario nella mia lista"
  - show_saved_games      # "Fammi vedere i miei giochi salvati"

entities:
  - game_title
  - console
  - genre
  - release_year
  - used_price
  - review_score
  - max_player
  - online
  - multiplatform
  - publisher
  - age_rating
  - filters_to_relax

slots:
  console:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: console
        intent: inform
        
  genre:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: genre
        intent: inform

  release_year:
    type: float
    influence_conversation: false    
    mappings:
      - type: from_text
        not_intent: 
          - search
          - stop_searching
          - reset
          - help
        conditions:
          - active_loop: game_preferences_form
            requested_slot: release_year

  used_price:
    type: float
    influence_conversation: false
    mappings:
      - type: from_text
        not_intent: 
          - search
          - stop_searching
          - reset
          - help
        conditions:
          - active_loop: game_preferences_form
            requested_slot: used_price

  review_score:
    type: float
    influence_conversation: false
    mappings:
      - type: from_text
        not_intent: 
          - search
          - stop_searching
          - reset
          - help
        conditions:
          - active_loop: game_preferences_form
            requested_slot: review_score  

  max_player:
    type: float
    influence_conversation: false
    mappings:
      - type: from_text
        not_intent: 
          - search
          - stop_searching
          - reset
          - help
        conditions:
          - active_loop: game_preferences_form
            requested_slot: max_player
  online:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_text
        not_intent: 
          - search
          - stop_searching  
          - reset
          - help
        conditions:
          - active_loop: game_preferences_form
            requested_slot: online

  multiplatform:
    type: bool
    influence_conversation: false
    mappings:
      - type: from_text
        not_intent: 
          - search
          - stop_searching  
          - reset
          - help
        conditions:
          - active_loop: game_preferences_form
            requested_slot: multiplatform

  publisher:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: publisher
        intent: inform

  age_rating:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: age_rating
        intent: inform

  last_result:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

  filters_to_relax:
    type: list
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: filters_to_relax
        intent: filters

  game_title_to_save:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: game_title

  saved_games:
    type: list
    influence_conversation: false
    mappings:
      - type: custom

forms:
  game_preferences_form:
    required_slots:
      - console
      - genre
      - release_year
      - used_price
      - review_score
      - max_player
      - online
      - multiplatform
      - publisher
      - age_rating

responses:
  utter_greet:
    - text: "Hi! 👋 I'll be your Retro Gaming Assistant. What do you want me to help you with?"

  utter_goodbye:
    - text: "Great, enjoy your retro gaming session! 🎮"

  utter_help:
    - text: |
        I'm your Retro Gaming Assistant! 🕹️ Here is what I can do:
        
        🔍 **Find Games**: Ask for a recommendation or specify filters (console, genre, etc.).
        🏆 **Top Charts**: Ask for "best sellers" or "highest rated games".
        💾 **Collection**: Say "save [Game Name]" or "show my saved games".
        ⚙️ **Settings**: Type "reset" to restart or "relax filters" if you get no results.
        
        What would you like to do?

  utter_ask_console:
    - text: "Do you have a specific console or device in mind? (e.g. Nintendo DS, PSP, PS3...)"

  utter_ask_genre:
    - text: "Do you have a favorite genre you like the most? For example Action, RPG, Sports, Strategy..."

  utter_ask_used_price:
    - text: "Do you have a maximum budget for a used game? Tell me an amount (e.g. 20)."

  utter_ask_release_year:
    - text: "Do you prefer games from a specific period? Specify a release year between 2004 and 2010."

  utter_ask_review_score:
    - text: "Do you have a minimum review score in mind? Provide a minimum review score from 0 to 100."

  utter_ask_max_player:
    - text: "Do you have a maximum number of players in mind? Tell me the maximum number of players."

  utter_ask_online:
    - text: "Is it important that the game has online features? Write 'skip' to skip this question."

  utter_ask_multiplatform:
    - text: "Do you want only platform exclusives, or are multiplatform games also fine? Write 'skip' to skip this question."

  utter_ask_publisher:
    - text: "Do you have a favorite game publisher? (e.g. Nintendo, Ubisoft...)"

  utter_ask_age_rating:
    - text: "Do you have a preferred age rating for the game? (e.g. E, T, M )"

  utter_start_recommendation:
    - text: "Great! I'll ask you a few questions so I can recommend something that fits you. Anytime you want to stop and search, just type 'show me the results'🙂"

  utter_ask_more_preferences:
    - text: "Do you want to specify more preferences? If yes, please inform me."

  utter_confirm_preferences:
    - text: |
        Perfect, here is a summary of your preferences:
        • Console: {console}
        • Genre: {genre}
        • Release year: {release_year}
        • Used game budget: {used_price}
        • Minimum review score: {review_score}
        • Max players: {max_player}
        • Online: {online}
        • Multiplatform: {multiplatform}
        • Publisher: {publisher}

  utter_submit:
    - text: "Okay, I'll search my archive of vintage games and show you some interesting titles... 🎮"
  
  utter_stop_searching:
    - text: "No problem! If you need anything else, just let me know. Goodbye! 👋"
  
  utter_reset_preferences:
    - text: "All your previous preferences have been reset."
  
  utter_ask_to_reset:
    - text: "Are you sure you want to reset the preference selection? All your previous answers will be lost."

  utter_no_results:
    - text: "I couldn't find any games matching all your filters. Do you want to relax the criteria a bit?"

  utter_which_filters_to_relax:
    - text: "Which filters would you like to relax? You can specify 'console', 'genre', 'release year', 'used price', 'review score', 'max players', 'online features', 'multiplatform', or 'publisher'."

  utter_console_invalid:
    - text: "Please provide a valid console or device name (e.g. Nintendo DS, PSP, PS2...)."

  utter_genre_invalid:
    - text: "Please provide a valid genre (e.g. Action, RPG, Sports...)."

  utter_release_year_invalid:
    - text: "Please provide a valid release year (from 2004 to 2010)."

  utter_used_price_invalid:
    - text: "Please provide a valid amount for your budget."

  utter_review_score_invalid:
    - text: "Please provide a valid review score between 0 and 100."

  utter_max_player_invalid:
    - text: "Please provide a valid number of maximum players (from 1 to 8)."

  utter_online_invalid:
    - text: "Please answer with 'online' or 'offline' regarding online features."

  utter_multiplatform_invalid:
    - text: "Please answer with 'exclusive' for platform exclusives or 'multiplatform' for games available on multiple platforms."

  utter_publisher_invalid:
    - text: "Please provide a valid publisher name (e.g. Nintendo, Ubisoft...)."

  utter_age_rating_invalid:
    - text: "Please provide a valid age rating (e.g. E, T, M)."

  utter_no_understanding:
    - text: "I'm sorry, I didn't understand that. Could you please rephrase?"

actions:
  - action_search_game
  - validate_game_preferences_form
  - action_reset_game_preferences
  - action_relax_filters
  - action_show_best_sellers
  - action_show_highest_rated
  - action_save_game
  - action_show_saved_games
  - action_show_best
  
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
