version: "3.1"

nlu:
- intent: greet
  examples: |
    - hi
    - hello
    - hey
    - good morning
    - good afternoon
    - hi there
    - hello everyone

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you
    - talk to you later
    - see you soon
    - thanks, bye
    - thanks, goodbye

- intent: submit
  examples: |
    - yes
    - ok
    - okay
    - sure
    - perfect
    - confirm
    - that's right
    - exactly
    - sounds good
    - show me the results
    - show me the games
    - let me see the games
    - show me the video game
    - let me see the video game
    - confirm and show the results
    - ok, go ahead
    - great, search the games
    - search now
    - start the search
    - confirm search
    - ok, run it
    - perfect, let me see

- intent: deny
  examples: |
    - no
    - not now
    - maybe another time
    - maybe later
    - not at the moment
    - I don't want to
    - I don't feel like it
    - I'm not interested
    - absolutely not
    - never
    - I don't think so
    - that's impossible
    - not really

- intent: request_form
  examples: |
    - I would like to buy a video game
    - I'm looking for a video game
    - I'm interested in a video game
    - can you help me find a video game?
    - recommend me a video game
    - I'd love a video game suggestion
    - suggest a video game for me
    - I'm searching for a game
    - I want a video game
    - give me a video game
    - show me a video game
    - help me choose a video game
    - help me find a video game
    - recommend a video game to buy
    - suggest a video game to buy
    - I'm looking for a video game to buy
    - can you help me find a game to buy?
    - I'd like a recommendation for a video game

- intent: inform
