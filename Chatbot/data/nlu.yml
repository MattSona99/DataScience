    - I want to play on [Xbox](console)
    - I need a game for [Wii](console)

    # GENRE
    - I prefer [Action](genre) games
    - I like [Sports](genre) games
    - I like [RPG](genre) games
    - I'm into [Simulation](genre) games
    - I want a [Racing / Driving](genre) game
