    - I want something with review score over [60](review_score)
    - I want a game rated above [90](review_score)

    # MAX PLAYERS
    - I only need [1](max_player) player
    - I need a game for [2](max_player) players
    - I want multiplayer for up to [4](max_player) players
    - [3](max_player)
    - a [2](max_player) player game is fine

    # ONLINE / MULTIPLATFORM / PUBLISHER
    - I want it to be [online](online)
