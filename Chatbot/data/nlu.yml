version: "3.1"

nlu:
- intent: greet
  examples: |
    - hi
    - hello
    - hey
    - good morning
    - good afternoon
    - hi there
    - hello everyone

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you
    - talk to you later
    - see you soon
    - thanks, bye
    - thanks, goodbye

- intent: submit
  examples: |
    - yes
    - ok
    - okay
    - sure
    - perfect
    - confirm
    - that's right
    - exactly
    - sounds good
    - show me the results
    - show me the games
    - let me see the games
    - show me the video game
    - let me see the video game
    - confirm and show the results
    - ok, go ahead
    - great, search the games
    - search now
    - start the search
    - confirm search
    - ok, run it
    - perfect, let me see

- intent: deny
  examples: |
    - no
    - not now
    - maybe another time
    - maybe later
    - not at the moment
    - I don't want to
    - I don't feel like it
    - I'm not interested
    - absolutely not
    - never
    - I don't think so
    - that's impossible
    - not really

- intent: request_form
  examples: |
    - I would like to buy a video game
    - I'm looking for a video game
    - I'm interested in a video game
    - can you help me find a video game?
    - recommend me a video game
    - I'd love a video game suggestion
    - suggest a video game for me
    - I'm searching for a game
    - I want a video game
    - give me a video game
    - show me a video game
    - help me choose a video game
    - help me find a video game
    - recommend a video game to buy
    - suggest a video game to buy
    - I'm looking for a video game to buy
    - can you help me find a game to buy?
    - I'd like a recommendation for a video game

- intent: inform
  examples: |
    - I'm looking for a game for [Nintendo DS](console)
    - I want something on [Sony PSP](console)
    - I'm interested in a game for [PS2](console)
    - I prefer [Action](genre) games
    - I like [Sports](genre) games
    - I like [RPG](genre) games
    - I want a game released after [2004](release_year)
    - find something released in [2004](release_year)
    - any game released before [2008](release_year) is fine
    - I want to spend at most [20](used_price)
    - maximum budget [15](used_price)
    - I don't want to spend more than [10](used_price)
    - choose only games with a score of at least [80](review_score)
    - I want a game with a score of at least [85](review_score)
    - I only need [1](max_player) player
    - I need a game for [2](max_player) players
    - I want multiplayer for up to [4](max_player) players
    - I want it to be [online](online)
    - I don't care if it's [online](online)
    - I prefer [multiplatform](multiplatform) games
    - I want an exclusive, so not [multiplatform](multiplatform)
    - I like the publisher [Nintendo](publisher)
    - I'm looking for something from [Ubisoft](publisher)


# --- Synonyms for entity VALUES ---

- synonym: videogame
  examples: |
    - video game
    - game
    - video-game
    - title
    - product
    - item

- synonym: Nintendo DS
  examples: |
    - NDS
    - nintendo ds
    - ds

- synonym: Sony PSP
  examples: |
    - psp
    - sony psp

- synonym: Action
  examples: |
    - action
    - action game

- synonym: Sports
  examples: |
    - sports
    - sports game
    - sport game

- synonym: RPG
  examples: |
    - rpg
    - role playing game
    - role-playing game

- synonym: online
  examples: |
    - with online mode
    - with online multiplayer
    - online features
    - online play

- synonym: multiplatform
  examples: |
    - multi platform
    - multi-platform
    - for multiple platforms
    - for multiple consoles
