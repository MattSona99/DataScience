version: "3.1"

rules:

- rule: Start game preferences form
  steps:
    - intent: request_form
    - action: utter_start_recommendation
    - action: game_preferences_form
    - active_loop: game_preferences_form

- rule: Continue filling game preferences form
  condition:
    - active_loop: game_preferences_form
  steps:
    # Rasa richiama la form finché ci sono slot da chiedere
    - action: game_preferences_form
    - active_loop: game_preferences_form

- rule: Submit game preferences form
  condition:
    - active_loop: game_preferences_form
  steps:
    # Quando tutti gli slot richiesti sono stati compilati
    - action: game_preferences_form
    - active_loop: null
    - action: utter_confirm_preferences

- rule: Stop game preferences form if user says no
  condition:
    - active_loop: game_preferences_form
  steps:
    - intent: deny
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_goodbye

- rule: User confirms search after preferences
  condition:
    - active_loop: null
  steps:
    - intent: submit
    - action: utter_submit
    # Qui poi chiamerai la tua custom action per leggere il CSV
    # - action: action_recommend_games
