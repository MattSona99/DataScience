version: "3.1"

rules:

- rule: Greet user
  steps:
    - intent: greet
    - action: utter_greet

- rule: Say goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye
    - active_loop: null

- rule: Ask to start game preferences form by inform 
  condition:
    - active_loop: null
  steps:
    - intent: inform
    - action: utter_ask_more_preferences

- rule: Starting game preferences form by submitting more preferences 
  steps:
    - action: utter_ask_more_preferences
    - intent: submit
    - action: utter_start_recommendation
    - action: game_preferences_form
    - active_loop: game_preferences_form

- rule: Search the game by denying more preferences 
  steps:
    - action: utter_ask_more_preferences
    - intent: deny
    - action: utter_submit
    - action: action_search_game

- rule: Start game preferences form
  steps:
    - intent: request_form
    - action: utter_start_recommendation
    - action: game_preferences_form
    - active_loop: game_preferences_form

- rule: Search game preferences form
  condition:
    - active_loop: game_preferences_form
  steps:
    - intent: search
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_confirm_preferences
    - action: utter_submit
    - action: action_search_game

- rule: Stop game preferences form if user says no
  condition:
    - active_loop: game_preferences_form
  steps:
    - intent: stop_searching
    - action: utter_stop_searching
    - action: action_deactivate_loop
    - active_loop: null
    - action: action_reset_game_preferences

- rule: Search the game after form is filled
  condition:
    - active_loop: game_preferences_form
  steps:
    - action: game_preferences_form      # Il form esegue l'ultimo step
    - active_loop: null                  # Il form si è spento da solo (finito)
    - slot_was_set:
      - requested_slot: null             # Conferma che non ci sono più slot richiesti
    - action: utter_confirm_preferences
    - action: utter_submit
    - action: action_search_game

- rule: Ask to reset game preferences if user asks 
  condition:
    - active_loop: game_preferences_form
  steps:
    - intent: reset
    - action: utter_ask_to_reset

- rule: Reset game preferences form if user confirms
  condition:
    - active_loop: game_preferences_form
  steps:
    - action: utter_ask_to_reset
    - intent: submit
    - action: action_reset_game_preferences
    - action: utter_start_recommendation
    - action: game_preferences_form

- rule: Do not reset game preferences form if user denies
  condition:
    - active_loop: game_preferences_form
  steps:
    - action: utter_ask_to_reset
    - intent: deny
    - action: game_preferences_form

- rule: Reset game preferences form anytime user asks
  steps:
    - intent: reset
    - action: action_reset_game_preferences

- rule: Ask to relax filters when no results found if user agrees
  steps:
    - action: utter_no_results
    - intent: submit
    - action: utter_which_filters_to_relax

- rule: Relax filters when no results found if user specifies filters
  steps:
    - action: utter_which_filters_to_relax
    - intent: inform
    - action: action_relax_filters
    - action: utter_submit
    - action: action_search_game

- rule: Do not relax filters when no results found if user denies
  steps:
    - action: utter_no_results
    - intent: deny
    - action: utter_goodbye

- rule: Respond with a default base response if user sends a message with low NLU confidence
  condition:
    - active_loop: game_preferences_form
  steps:
  - intent: nlu_fallback
  - action: utter_no_understanding
  - action: game_preferences_form
