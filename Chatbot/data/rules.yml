version: "3.1"

rules:

- rule: Greet user
  steps:
    - intent: greet
    - action: utter_greet

- rule: Say goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye
    - active_loop: null

- rule: Start game preferences form
  steps:
    - intent: request_form
    - action: utter_start_recommendation
    - action: game_preferences_form
    - active_loop: game_preferences_form

- rule: Submit game preferences form
  condition:
    - active_loop: game_preferences_form
  steps:
    - intent: submit
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_submit
    - action: action_search_game

- rule: Stop game preferences form if user says no
  condition:
    - active_loop: game_preferences_form
  steps:
    - intent: deny
    - action: action_deactivate_loop
    - active_loop: null
    - action: utter_goodbye

