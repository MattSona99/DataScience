version: "3.1"

rules:

- rule: Activate videogame preferences form
  steps:
    - intent: request_form
    - action: utter_start_recommendation
    - action: game_preferences_form
    - active_loop: game_preferences_form

- rule: Continue filling the form
  condition:
    - active_loop: game_preferences_form
  steps:
    - action: game_preferences_form
    - active_loop: game_preferences_form

- rule: Form finished and confirm preferences
  condition:
    - active_loop: game_preferences_form
  steps:
    - action: game_preferences_form
    - active_loop: null
    - action: utter_confirm_preferences

- rule: User confirms and asks for results
  steps:
    - intent: submit
    - action: utter_submit
    # later you'll add:
    # - action: action_recommend_games
